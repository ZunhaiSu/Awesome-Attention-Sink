name: Validate literature catalog
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/catalog.py check
      - run: python scripts/catalog.py build
      - run: git diff --exit-code -- exports docs/CATALOG.md
